# Baremetal cluster for NVMeoF spec listener_network_masks E2E
#
# Minimum:
#   - 4 nodes with role nvmeof-gw (node5-node8)
#   - each of those nodes has >= 2 non-loopback IPv4 interfaces
#   - 1 client (node9)
#
# The suite discovers the interfaces from `ip a`. No NIC names are hardcoded.
#   primary   = IPv4 hosting the gateway (the node ip below)
#   secondary = another IPv4 on a different interface
#
# Update hostname / ip / root_password / volumes to match the lab.
#
# Suggested run:
#   conf/umbrella/nvmeof/ceph_nvmeof_spec-gw-netmask-baremetal.yaml
#   suites/umbrella/nvmeof/tier-2_nvmeof_e2e_spec-gw-netmask.yaml
---
globals:
  - ceph-cluster:
      name: ceph
      networks:
        public:
          - 10.64.0.0/23
      nodes:
        - hostname: tala002
          id: node1
          ip: 10.64.0.188
          root_password: passwd
          role:
            - mon
            - mgr
            - installer
            - _admin
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala003
          id: node2
          ip: 10.64.0.189
          root_password: passwd
          role:
            - mon
            - osd
            - mgr
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala004
          id: node3
          ip: 10.64.0.190
          root_password: passwd
          role:
            - mon
            - osd
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala005
          id: node4
          ip: 10.64.0.191
          root_password: passwd
          role:
            - osd
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        # 4x NVMeoF gateways — each must expose >= 2 IPv4 interfaces
        - hostname: tala010
          id: node5
          ip: 10.64.0.196
          root_password: passwd
          role:
            - nvmeof-gw
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala011
          id: node6
          ip: 10.64.0.197
          root_password: passwd
          role:
            - nvmeof-gw
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala012
          id: node7
          ip: 10.64.0.198
          root_password: passwd
          role:
            - nvmeof-gw
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala013
          id: node8
          ip: 10.64.0.199
          root_password: passwd
          role:
            - nvmeof-gw
          volumes:
            - /dev/sdc
            - /dev/sdd
            - /dev/sde
            - /dev/sdf
            - /dev/sdg
            - /dev/nvme0n1

        - hostname: tala001
          id: node9
          ip: 10.64.0.187
          root_password: passwd
          role:
            - client
