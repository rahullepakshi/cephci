# E2E: network mask in the NVMeoF spec for auto-add listeners
#
# cluster configuration file:
#   conf/umbrella/nvmeof/ceph_nvmeof_spec-gw-netmask-baremetal.yaml
#
# Requires >= 4 nvmeof gateways. Each gateway needs two non-loopback IPv4
# interfaces. The test discovers them from `ip a` (no hardcoded NIC names):
#   primary   = IPv4 that hosts the gateway (node ip)
#   secondary = IPv4 on another interface
# listener_network_masks is filled from those CIDRs before the service
# is applied.
#
# Optional overrides under spec_gw_netmask:
#   secondary_iface / primary_network_mask / secondary_network_mask /
#   dummy_network_mask
#
# Coverage in test_ceph_nvmeof_spec_gw_netmask.py:
#   1. Apply listener_network_masks mask A (primary and secondary subnets)
#   2. cnode1 is created with --use-group-config-network-masks
#   3. cnode2 is created without the flag (default false, no group listeners)
#   4. subsystem list shows the effective mask; json/yaml include the flag
#   5. cnode3 keeps its own network_mask. cnode4 keeps one manual listener
#   6. set_use_group_config_network_masks true makes cnode2 follow mask A
#   7. FIO on cnode1 while mask A still covers the primary gateway address
#   8. Reapply mask B (secondary subnet plus a non-matching CIDR). Both
#      opted-in subsystems drop mask A listeners and keep mask B listeners
#   9. listener del of a spec auto-listener is rejected. Both mask sources
#      on one subsystem add are rejected
#  10. Scoped refresh and scale down/up, then restore the mask B listeners
#  11. Opt cnode2 out. Manual listeners and cnode3's network_mask stay
#  12. Final subsystem list --format json and --format yaml match that state

tests:
  - test:
      abort-on-fail: true
      module: install_prereq.py
      name: install ceph pre-requisites

  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                mon-ip: node1
                registry-url: registry.redhat.io
                allow-fqdn-hostname: true
                log-to-file: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: RHCS cluster deployment using cephadm
      destroy-cluster: false
      module: test_cephadm.py
      name: deploy cluster

  - test:
      abort-on-fail: true
      config:
        command: add
        id: client.1
        nodes:
          - node9
        install_packages:
          - ceph-common
          - nvme-cli
        copy_admin_keyring: true
      desc: Setup clients for NVMeoF tests
      destroy-cluster: false
      module: test_client.py
      name: configure Ceph client for NVMe tests

  - test:
      abort-on-fail: true
      config:
        gw_nodes:
          - node5
          - node6
          - node7
          - node8
        rbd_pool: rbd
        nvme_metadata_pool: rbd
        gw_group: group1
        install: true
        spec_deployment: true
        do_not_create_image: true
        rep-pool-only: true
        rep_pool_config:
          pool: rbd
        cleanup:
          - initiators
          - subsystems
          - pool
          - gateway
        spec_gw_netmask: {}
        subsystems:
          - nqn: nqn.2016-06.io.spdk:cnode1
            serial: 1
            role: spec-opt-in-at-create
            listener_port: 4420
            allow_host: "*"
            bdevs:
              count: 2
              size: 10G
              ns_create_image: true
          - nqn: nqn.2016-06.io.spdk:cnode2
            serial: 2
            role: opt-in-existing-then-out
            listener_port: 4420
          - nqn: nqn.2016-06.io.spdk:cnode3
            serial: 3
            role: subsystem-network-mask
            listener_port: 4420
          - nqn: nqn.2016-06.io.spdk:cnode4
            serial: 4
            role: manual-listener
            listener_port: 4420
        initiators:
          - node: node9
            nqn: connect-all
            listener_port: 4420
        load_balancing:
          - scale_down: ["node8"]
          - scale_up: ["node8"]
      desc: >
        E2E for NVMeoF listener_network_masks in the gateway spec and
        subsystem opt-in via use-group-config-network-masks
      destroy-cluster: false
      module: test_ceph_nvmeof_spec_gw_netmask.py
      name: NVMeoF spec gateway network-mask E2E
